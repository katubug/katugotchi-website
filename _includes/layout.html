<!DOCTYPE html>
<html lang="en">
  <head>
    <title>katugotchi - resources and tamagotchi art</title>
    <meta name="description" content="katugotchi is a site for tamagotchi art, thoughts, and resource links!">
    <link rel="icon" href="/images/favicon.png" type="image/x-icon"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gorditas:wght@400;700&family=Short+Stack&display=swap" rel="stylesheet">
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="stylesheet" href="https://underkat.neocities.org/onionring.css">

    <!-- runs before paint so the frame doesn't flash -->
    <script>
      try {
        if (localStorage.getItem("frameless") === "1") document.documentElement.classList.add("frameless");
      } catch (e) {}
    </script>

    <script>
      // Template generated with petrapixel's layout generator.
      // (Please do not remove this credit.)
      console.log("%cTemplate generated with petrapixel's layout generator: https://petrapixel.neocities.org/coding/layout-generator", "font-size: 14pt; color: #922a45; background: #ffd3ef");
    </script>
  </head>
  <body>
    <!-- skip link for keyboard folks, leave it -->
    <a href="#content" id="skip-to-content-link">Skip to content</a>

    <div class="layout">

      <!-- LEFT SIDEBAR -->
      <aside class="left-sidebar">
        <div class="site-title"><a href="/">katugotchi</a></div>

        <nav class="sidebar-section">
          <ul>
            <li><a href="/">home</a></li>
            <li><a href="/blog/">blog</a></li>
            <li><a href="/guides/">guides</a></li>
            <li><a href="/resources/">tamagotchi resources</a></li>
            <li><a href="/youtube/">youtube resources</a></li>
          </ul>
        </nav>

        <div class="sidebar-section frame-toggle-section">
          <button type="button" class="frame-toggle" aria-pressed="false">hide tama frame</button>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-title">Other Links</div>
          <p>Check out my <a href="https://witchbriarcottage.etsy.com" target="_blank">Etsy Shop</a> to see my tama stickers and keychains!</p>
          <div id="tamafan"><script type="text/javascript" src="https://underkat.neocities.org/tamafan/onionring-variables.js"></script>
<script type="text/javascript" src="https://underkat.neocities.org/tamafan/onionring-widget7.js"></script></div>
      </aside>

      <!-- THE TAMA -->
      <div class="tama">
        <main id="content" class="tama-screen"> <!-- Do NOT remove the ID here -->
          {{content}}
        </main>
        <img class="tama-frame" src="/images/tamaframepixel.png" alt="">

        <!-- menu that pops up on the screen -->
        <div class="tama-menu" id="tama-menu" hidden>
          <ul>
            <li><a href="/">home</a></li>
            <li><a href="/blog/">blog</a></li>
            <li><a href="/guides/">guides</a></li>
            <li><a href="/resources/">tamagotchi resources</a></li>
            <li><a href="/youtube/">youtube resources</a></li>
            <li><a href="https://witchbriarcottage.etsy.com" target="_blank">etsy shop</a></li>
          </ul>
        </div>

        <!-- the hearts: A = next, B = pick, C = cancel -->
        <button class="tama-btn tama-btn-a" aria-label="A: open menu / next item"></button>
        <button class="tama-btn tama-btn-b" aria-label="B: select"></button>
        <button class="tama-btn tama-btn-c" aria-label="C: close menu / go home"></button>
      </div>

    </div>

    <script>
      const menu = document.getElementById("tama-menu");
      const items = [...menu.querySelectorAll("a")];
      let sel = 0;

      function highlight() {
        items.forEach((a, i) => a.classList.toggle("selected", i === sel));
      }

      function openMenu() {
        // start on whatever page we're on
        const here = items.findIndex((a) => a.getAttribute("href") === location.pathname);
        sel = here === -1 ? 0 : here;
        menu.hidden = false;
        highlight();
      }

      document.querySelector(".tama-btn-a").onclick = () => {
        if (menu.hidden) return openMenu();
        sel = (sel + 1) % items.length;
        highlight();
      };

      document.querySelector(".tama-btn-b").onclick = () => {
        if (menu.hidden) return openMenu();
        items[sel].click();
      };

      document.querySelector(".tama-btn-c").onclick = () => {
        if (!menu.hidden) menu.hidden = true;
        else location.href = "/";
      };

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") menu.hidden = true;
      });

      // hovering a menu item moves the arrow too
      items.forEach((a, i) => a.addEventListener("mouseenter", () => { sel = i; highlight(); }));

      // frame on/off, remembered across pages
      const frameToggle = document.querySelector(".frame-toggle");

      function syncToggle() {
        const off = document.documentElement.classList.contains("frameless");
        frameToggle.textContent = off ? "show tama frame" : "hide tama frame";
        frameToggle.setAttribute("aria-pressed", off);
      }

      frameToggle.onclick = () => {
        const off = document.documentElement.classList.toggle("frameless");
        menu.hidden = true;
        try { localStorage.setItem("frameless", off ? "1" : "0"); } catch (e) {}
        syncToggle();
      };

      syncToggle();
    </script>
  </body>
</html>
